experiment:
  name: baseline_t4_small
  seed: 1337
  deterministic: false
  notes: "Baseline GPT run sized for a Colab T4 pilot."

data:
  dataset_type: synthetic
  tokenizer_type: char
  block_size: 128
  batch_size: 16
  eval_batch_size: 16
  num_workers: 2
  pin_memory: true
  synthetic:
    num_train_sequences: 8192
    num_val_sequences: 1024
    min_pattern_length: 5
    max_pattern_length: 18
    task_mix: ["copy", "reverse", "sort", "shift", "interleave"]

model:
  architecture: baseline
  max_seq_len: 128
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  bias: true
  tie_weights: true
  norm_eps: 1.0e-5
  init_std: 0.02
  attnres:
    enabled: false
    window_size: null
    temperature: 1.0
    rmsnorm_keys: true
    zero_init_queries: true
    include_embedding: true
    keep_embedding_in_window: true
    final_readout: true

training:
  max_steps: 1000
  grad_accum_steps: 1
  learning_rate: 0.0003
  min_lr: 0.00003
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  mixed_precision: true
  amp_dtype: bfloat16
  compile_model: false
  log_interval: 10
  eval_interval: 100
  probe_interval: 100
  checkpoint_interval: 250
  eval_max_batches: 50
  device: auto
  resume_from: null

logging:
  output_root: runs
  save_probes: true
  save_checkpoints: true
  keep_last_k_checkpoints: 2

evaluation:
  max_batches: 50
  run_ablation: true
  ablation_fractions: [0.25, 0.5]
